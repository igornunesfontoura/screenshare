name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm --prefix server run typecheck
      - run: npm test
      # Lógica do helper de áudio do Windows (plano de captura e mixagem) roda em qualquer SO.
      - run: npm run test:win-audio
      # Mesmos testes do signaling contra o worker.ts rodando no wrangler dev.
      - run: npm --prefix server run test:worker

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: --linux
            app: release/*/linux-unpacked/screenshare
            # latest*.yml e .blockmap são o que o electron-updater do app lê.
            artifact: |
              release/*/*.AppImage
              release/*/latest-linux.yml
          - os: windows-latest
            dist: --win
            app: release/*/win-unpacked/ScreenShare.exe
            artifact: |
              release/*/*.exe
              release/*/*.exe.blockmap
              release/*/latest.yml
    runs-on: ${{ matrix.os }}
    # Um app travado no smoke test não pode segurar o runner por horas.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # O instalador do Windows leva o helper de áudio por app (extraResources).
      - name: Build audio helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win-audio
      - run: npx electron-builder ${{ matrix.dist }} --publish never

      # Ubuntu 24.04 bloqueia user namespaces via AppArmor, o que quebra o sandbox
      # do Chromium; liberamos no runner em vez de rodar o app com --no-sandbox.
      - name: Allow Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # O app empacotado precisa de uma tela; no Linux do CI usamos xvfb.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs ${{ matrix.app }}
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/smoke.mjs ${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: screenshare-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Tag v* (npm run release) publica a versão; os apps instalados a baixam sozinhos.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # O updater compara a versão do latest.yml (package.json) com a do app.
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Os artefatos chegam dentro da pasta da versão (release/<versão>/); achata em dist/.
      - run: mkdir dist && find artifacts -type f -exec mv -t dist {} + && ls -la dist
      # Sem os manifestos a release sai, mas nenhum app instalado se atualiza.
      - name: Check updater files
        run: test -f dist/latest.yml && test -f dist/latest-linux.yml && ls dist/*.AppImage dist/*Setup*.exe dist/*Portatil*.exe
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ScreenShare $GITHUB_REF_NAME" --generate-notes
