[package]
name = "screenshare-audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Captura o áudio de apps escolhidos no Windows (process loopback) para o ScreenShare"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
