appId: com.screenshare.app
productName: ScreenShare
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
# Releases do GitHub: o CI publica ao receber uma tag v* e o electron-updater
# do app procura versões novas ali (src/main/updater.ts).
publish:
  provider: github
  owner: igornunesfontoura
  repo: screenshare
  releaseType: release
linux:
  # deb desligado até o projeto ter uma homepage (metadado obrigatório do pacote).
  target: [AppImage]
  # WM_CLASS da janela = nome do .desktop, para o ambiente ligar janela e atalho.
  syncDesktopName: true
  category: Video
  executableName: screenshare
  icon: build/icon.png
  synopsis: Compartilhamento de tela P2P em alta qualidade
# Nomes sem espaço: o GitHub troca espaços nos assets e o latest.yml deixaria de bater.
appImage:
  artifactName: ScreenShare-${version}.${ext}
win:
  target: [nsis, portable]
  icon: build/icon.ico
portable:
  artifactName: ScreenShare-Portatil-${version}.${ext}
nsis:
  artifactName: ScreenShare-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
